<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Verb Gym — Irregular Verbs Trainer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F0F5F3'/%3E%3Cpath d='M9 11v10M23 11v10M6 13v6M26 13v6' stroke='%23D9480F' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M9 16h14' stroke='%230C2227' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap">
  <style>
  :root{
    color-scheme:light;
    --bg:#F0F5F3; --surface:#FFFFFF; --surface2:#E4ECE9; --line:#CEDBD7; --fg:#0C2227; --muted:#51666A;
    --m1:#D9480F; --m2:#08747F; --m3:#C2255C; --on-m:#FFFFFF;
    --good:#0F7A55; --good-bg:#DCF4E8; --bad:#C42B2B; --bad-bg:#FCE3E3; --hot:#E8590C;
    --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
    --f-body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#081619; --surface:#10252A; --surface2:#173137; --line:#26434B; --fg:#E5F0EE; --muted:#9AB3B4;
      --m1:#FF8A4C; --m2:#3CC4D2; --m3:#FF6E9C; --on-m:#07181B;
      --good:#4CE0A0; --good-bg:#0E3A2B; --bad:#FF8383; --bad-bg:#412020; --hot:#FF8A4C;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font:400 16px/1.5 var(--f-body);
    padding-top:max(14px,env(safe-area-inset-top,0px));
    padding-bottom:max(56px,env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  [hidden]{display:none!important}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  button{font:inherit}
  .wrap{max-width:1040px;margin:0 auto}
  .game{max-width:720px;margin:0 auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:3px solid var(--c,var(--m2));outline-offset:2px}

  /* Top navigatiebalk */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 26px}
  .brand-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--fg);cursor:pointer;font:800 24px/1 var(--f-display);letter-spacing:-.03em}
  .brand i{width:12px;height:12px;border-radius:50%;background:var(--m1);display:block;box-shadow:0 0 0 4px rgba(217,72,15,.15)}
  .level-badge{font:600 12px/1 var(--f-body);padding:6px 11px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .top-actions{display:flex;align-items:center;gap:10px}
  .streak-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font:700 14px/1 var(--f-body);color:var(--fg)}
  .streak-pill.active{border-color:rgba(232,89,12,.45);background:rgba(232,89,12,.08);color:var(--hot)}
  .streak-pill svg{width:17px;height:17px;color:var(--hot)}

  /* Knoppen */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:12px;border:1.5px solid transparent;
    font:700 14px var(--f-body);cursor:pointer;color:var(--fg);background:transparent;transition:transform .12s,background .15s,border-color .15s}
  .btn svg{width:18px;height:18px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--c,var(--fg));color:var(--on-m);font-size:15px;padding:10px 20px}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.outline{border-color:var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(12,34,39,.04)}
  .btn.outline:hover{border-color:var(--fg)}
  .btn.ghost{color:var(--muted);padding-inline:10px}
  .btn.ghost:hover{color:var(--fg)}

  /* Uitspraak knop */
  .spk-word{cursor:pointer;text-decoration:underline dotted var(--line);text-underline-offset:4px;transition:color .15s,text-decoration-color .15s}
  .spk-word:hover{color:var(--m2);text-decoration-color:var(--m2)}
  .fb .forms{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .spk-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--m2);font:600 13px var(--f-body);cursor:pointer;flex:none;transition:transform .1s,border-color .15s}
  .spk-pill:hover{border-color:var(--m2)}
  .spk-pill:active{transform:scale(.96)}
  .spk-pill svg{width:15px;height:15px}

  /* Hero sectie */
  .hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:6px 32px}
  h1{font:800 clamp(36px,6vw,58px)/1.04 var(--f-display);letter-spacing:-.035em;margin:0}
  h1 .accent{display:block;color:var(--m1)}
  h2{font:700 22px/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
  .lead{color:var(--muted);max-width:42ch;text-wrap:pretty;margin:14px 0 0;font-size:17px;line-height:1.5}
  .hero-pills{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
  .meta-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font:600 13px/1 var(--f-body);color:var(--muted);box-shadow:0 1px 2px rgba(12,34,39,.03)}
  .meta-pill.record{border-color:rgba(8,116,127,.35);background:rgba(8,116,127,.06);color:var(--fg)}
  .meta-pill svg{width:14px;height:14px;color:var(--m2)}
  .meta-pill b{color:var(--fg);font-weight:700}

  /* Voorbeeldkaart rechts in de hero */
  .ladder{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 16px rgba(12,34,39,.04)}
  .ladder-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line);font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ladder-body{padding:6px 20px 10px;font:500 14.5px var(--f-mono)}
  .ladder .lr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
  .ladder .lr.head{border-top:0;font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
  .ladder .lr.ex{cursor:pointer;border-radius:8px;transition:background .15s}
  .ladder .lr.ex:hover{background:var(--surface2)}
  .ladder .lr.ex span:first-child{display:inline-flex;align-items:center;gap:6px}
  .ladder .lr.ex span:first-child svg{width:14px;height:14px;color:var(--muted);opacity:.75}
  .ladder .lr span:nth-child(2){color:var(--m1);font-weight:600}
  .ladder .lr span:nth-child(3){color:var(--m2);font-weight:600}
  .ladder .lr.head span{color:var(--muted);font-weight:700}

  /* Filterbalk & Kaarten */
  .poolrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:20px}
  .lab{font:700 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;min-height:38px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--fg)}
  .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .chip svg{width:15px;height:15px}

  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .mode{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 2px 10px rgba(12,34,39,.03)}
  .ico{width:46px;height:46px;border-radius:14px;background:var(--c);color:var(--on-m);display:grid;place-items:center}
  .mode p{margin:0;color:var(--muted);font-size:15px}
  .eg{font:500 13.5px/1.55 var(--f-mono);background:var(--surface2);border-radius:12px;padding:11px 13px;color:var(--fg);overflow-wrap:anywhere}
  .eg .ok-ex{color:var(--good);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .mode .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px}
  .rec{font-size:14px;color:var(--muted)} .rec b{color:var(--fg);font:700 18px var(--f-display)}
  .tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
  .tog input{width:18px;height:18px;accent-color:var(--m1);flex:none;cursor:pointer}

  /* HUD & Voortgangsbalk */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 14px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font:600 13px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
  .pill b{font:700 18px/1 var(--f-display);color:var(--fg)}
  .pill svg{width:18px;height:18px}
  .pill.streak.hot{border-color:var(--hot);color:var(--hot)} .pill.streak.hot b{color:var(--hot)}
  .pill.streak.hot svg{animation:flick .8s ease-in-out infinite alternate}
  .pill.low{border-color:var(--bad);color:var(--bad)} .pill.low b{color:var(--bad)}
  .bump{animation:bump .35s}
  @keyframes bump{40%{transform:scale(1.14)}}
  @keyframes flick{to{transform:scale(1.18) rotate(-6deg)}}
  .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .35s ease}
  .bar.time i{transition:width .12s linear}

  /* Vraagkaart */
  .q{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);margin-top:16px}
  .kicker{font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin:0 0 16px}
  .given{display:flex;flex-wrap:wrap;gap:14px 36px;margin-bottom:24px}
  .given .nl{font:800 clamp(28px,6vw,40px)/1.1 var(--f-display);letter-spacing:-.02em;display:block;margin-top:4px}
  .given .mono{font:500 clamp(22px,5vw,30px)/1.2 var(--f-mono);display:block;margin-top:6px}
  .game.wide{max-width:900px}
  .fields4{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .fields4 .fld{min-width:0}
  .fix{margin-top:6px;min-height:52px;display:flex;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface2);font:500 19px/1.3 var(--f-mono);overflow-wrap:anywhere}
  .fix.nl{font:italic 500 17px/1.3 var(--f-body);color:var(--muted)}
  @media (max-width:760px){.fields4{grid-template-columns:1fr}}
  .fld .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .in{flex:1 1 150px;min-width:0;font:500 19px var(--f-mono);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
  .in:focus{outline:none;border-color:var(--c)}
  .in.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .in.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .in:disabled{opacity:1;-webkit-text-fill-color:currentColor}
  .ans{display:inline-flex;align-items:center;gap:6px;font:600 16px var(--f-mono)}
  .ans svg{width:18px;height:18px}
  .ans.ok{color:var(--good)} .ans.bad{color:var(--bad)}
  .actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
  .fb{margin-top:18px}
  .fb .why{margin:12px 0 0;color:var(--muted);font-size:15px}
  .fb .forms{margin:12px 0 0;font:500 15px var(--f-mono);background:var(--surface2);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
  .fblist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .fblist li{display:flex;gap:10px;align-items:flex-start}
  .fblist li svg{margin-top:2px;width:20px;height:20px}
  .fblist li.ok svg{color:var(--good)} .fblist li.bad svg{color:var(--bad)}
  .note{margin:0;color:var(--bad);font-weight:600}
  .msg-good{color:var(--good);font-weight:700;margin:0}

  /* Context modus */
  .sent{font:500 clamp(20px,4.6vw,28px)/1.75 var(--f-body);margin:0}
  .gap{display:inline-block;flex:none;width:9.5ch;font-size:.82em;padding:2px 8px;margin-inline:4px;border-width:0 0 3px;border-radius:6px 6px 0 0;vertical-align:baseline}
  mark.ok{background:var(--good-bg);color:var(--good);border-radius:6px;padding:0 8px;font:500 .85em var(--f-mono)}
  del{color:var(--bad);text-decoration-thickness:2px}
  .hint{display:block;margin-top:4px;font:500 14px var(--f-mono);color:var(--muted)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .segb{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;min-width:0}
  .segb b{font:700 16px var(--f-body)} .segb small{color:var(--muted);font-size:13px}
  .segb:hover{border-color:var(--fg)}
  .segb.sel{border-color:var(--c);background:var(--surface2)}
  .segb.ok{border-color:var(--good);background:var(--good-bg)}
  .segb.bad{border-color:var(--bad);background:var(--bad-bg)}
  .tl{margin-top:22px}

  /* Speedrun */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .opt{display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:500 clamp(17px,4.4vw,21px) var(--f-mono);cursor:pointer;text-align:left;min-width:0;overflow-wrap:anywhere}
  .opt .key{font:700 12px var(--f-body);width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
  .opt:hover{border-color:var(--c)}
  .opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  @media (hover:none){.opt .key{display:none}}
  .intro p{color:var(--muted);margin:0 0 12px}
  .rules{margin:0 0 22px;padding-left:20px;color:var(--muted)}

  /* Resultaat */
  .score{font:800 clamp(64px,16vw,112px)/1 var(--f-display);letter-spacing:-.04em;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--c);color:var(--on-m);font:700 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}
  .stat{background:var(--surface2);border-radius:14px;padding:14px}
  .stat b{display:block;font:800 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  .missed h3{font:700 16px var(--f-display);margin:26px 0 10px}

  /* Spiekbriefje */
  .cs-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0 14px}
  .search{flex:1 1 220px;max-width:340px;font:500 16px var(--f-body);padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
  .search:focus{outline:none;border-color:var(--m2)}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{background:var(--m1);color:var(--on-m);text-align:left;padding:12px 14px;font:700 13px var(--f-body);letter-spacing:.03em}
  td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--surface2)}
  td.m{font-family:var(--f-mono)}
  td.nl{font-style:italic;color:var(--muted)}
  table.hid-ps td.c-ps:not(.rev),table.hid-pp td.c-pp:not(.rev),table.hid-nl td.c-nl:not(.rev){color:transparent;text-shadow:0 0 9px var(--fg);cursor:pointer;user-select:none}
  .count{color:var(--muted);font-size:14px;margin:0 0 10px}
  .empty{padding:28px;text-align:center;color:var(--muted)}

  @media (max-width:860px){
    .modes{grid-template-columns:1fr}
    .hero{grid-template-columns:1fr;gap:24px}
  }
  @media (max-width:600px){
    .hide-s{display:none}
    .ladder{display:none}
    th,td{padding:9px 8px;font-size:14px}
    .level-badge{display:none}
  }
  @media (max-width:360px){.seg,.opts{grid-template-columns:1fr}}
  .wflag{display:inline-flex;align-items:center;vertical-align:middle;margin-left:8px;color:var(--hot);cursor:help}
  .wflag.high{color:var(--bad)}
  .wflag svg{width:17px;height:17px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>

<div class="wrap" id="app"></div>
<noscript>Zet JavaScript aan om te oefenen.</noscript>

<script>
(function(){
'use strict';

/* ---------- Data: Lijst 1 & Lijst 2 (82 werkwoorden) ---------- */
const L1=`to be|was / were|been|zijn
to bear|bore|borne / born|verdragen
to become|became|become|worden
to begin|began|begun|beginnen
to bet|bet|bet|wedden
to bite|bit|bitten|bijten
to break|broke|broken|breken
to bring|brought|brought|brengen
to build|built|built|bouwen
to burn|burnt / burned|burnt / burned|branden
to buy|bought|bought|kopen
to catch|caught|caught|vangen
to choose|chose|chosen|kiezen
to come|came|come|komen
to cost|cost|cost|kosten
to cut|cut|cut|knippen; snijden
to dig|dug|dug|graven
to do|did|done|doen
to draw|drew|drawn|tekenen
to drink|drank|drunk|drinken
to drive|drove|driven|rijden
to eat|ate|eaten|eten
to fall|fell|fallen|vallen
to feed|fed|fed|eten geven
to feel|felt|felt|voelen
to fight|fought|fought|vechten
to find|found|found|vinden
to flee|fled|fled|vluchten
to fly|flew|flown|vliegen
to forget|forgot|forgotten|vergeten
to forgive|forgave|forgiven|vergeven
to freeze|froze|frozen|(be)vriezen
to get|got|got / gotten (AmE)|krijgen
to give|gave|given|geven
to go|went|gone|gaan
to grow|grew|grown|groeien
to have|had|had|hebben
to hang|hung|hung|hangen
to hear|heard|heard|horen
to hide|hid|hidden|verstoppen
to hit|hit|hit|slaan; raken`;

const L2=`to hold|held|held|(vast)houden
to hurt|hurt|hurt|pijn doen
to keep|kept|kept|houden
to know|knew|known|weten; kennen
to learn|learnt / learned|learnt / learned|leren
to leave|left|left|achterlaten
to lend|lent|lent|(uit)lenen
to let|let|let|laten; verhuren
to lie|lay|lain|liggen
to lose|lost|lost|verliezen
to make|made|made|maken
to meet|met|met|ontmoeten
to pay|paid|paid|betalen
to put|put|put|plaatsen; zetten

const $=function(s,r){return (r||document).querySelector(s);};
const $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
const app=$('#app');
const esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
const pick=function(a){return a[Math.floor(Math.random()*a.length)];};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const strip=function(s){return s.replace(/\s*\(.*?\)/g,'').trim();};
const norm=function(s){return s.toLowerCase().replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();};
const variants=function(s){return norm(s).split('/').map(function(x){return x.trim();}).filter(Boolean);};
function isOk(typed,correct,isInf){
  let t=norm(typed),c=correct;
  if(isInf){t=t.replace(/^to /,'');c=c.replace(/^to /,'');}
  if(!t)return false;
  const v=variants(c);
  const parts=t.split('/').map(function(x){return x.trim();}).filter(Boolean);
  return parts.length>0&&parts.every(function(p){return v.indexOf(p)>-1;});
}

function updateHud(){
  if(!G)return;
  const s=$('#pScore');if(s)s.textContent=G.score;
  const st=$('#sv');if(st)st.textContent=G.streak;
  const p=$('#pStreak');if(p)p.classList.toggle('hot',G.streak>=3);

}
function award(v){
  G.streak++;
  G.best=Math.max(G.best,G.streak);
  if(G.streak>(hi.bestStreak||0)){hi.bestStreak=G.streak;saveHi();}
  G.score+=10+Math.min(G.streak-1,5)*2;
  G.correct++;
  if(v&&weak[v.key]){weak[v.key]--;if(weak[v.key]<=0)delete weak[v.key];saveWeak();}
  updateHud();
  const p=$('#pStreak');if(p){p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');}
}
function miss(v){
  G.streak=0;
  if(v){G.missed.set(v.inf,v);weak[v.key]=(weak[v.key]||0)+3;saveWeak();}
  updateHud();
}
function newG(mode,extra){
  const g={mode:mode,score:0,streak:0,best:0,correct:0,total:0,missed:new Map(),checked:false,i:0,queue:[]};
  for(const k in extra)g[k]=extra[k];
  return g;
}

/* ---------- Stand 3: speedrun ---------- */
function regularFake(inf){
  const b=inf.replace(/^to /,'');
  if(/e$/.test(b))return b+'d';
  if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ied';
  if(/^[^aeiou]*[aeiou][bdgmnprt]$/.test(b))return b+b.slice(-1)+'ed';
  return b+'ed';
}
function makeOptions(v,kind){
  const seen={},out=[];
  variants(v[kind]).forEach(function(x){seen[x]=1;});
  function add(txt){
    const vs=variants(txt);
    if(vs.some(function(x){return seen[x];}))return;
    vs.forEach(function(x){seen[x]=1;});
    out.push(strip(txt));
  }
  const other=kind==='ps'?v.pp:v.ps;
  shuffle([other,regularFake(v.inf),v.inf.replace(/^to /,'')]).forEach(function(t){if(out.length<3)add(t);});
  let guard=0;
  while(out.length<3&&guard++<300){const w=pick(V);add(pick([w.ps,w.pp]));}
  const all=shuffle(out.map(function(t){return {t:t,ok:false};}).concat([{t:strip(v[kind]),ok:true}]));
  return {opts:all,ci:all.findIndex(function(o){return o.ok;})};
}

  '<section class="q intro" style="--c:var(--m3)"><p class="kicker">Speedrun</p><h1 style="font-size:clamp(30px,6vw,46px)">60 seconden. Zoveel mogelijk goed.</h1>'+
  '<ul class="rules"><li>Je ziet een werkwoord en kiest uit vier vormen.</li><li>Goed antwoord: punten, en je streak groeit. Hoe langer je streak, hoe meer bonuspunten.</li><li>Fout antwoord: je streak start opnieuw. Je ziet kort het goede antwoord.</li><li>Op een computer kun je ook de toetsen 1 tot en met 4 gebruiken.</li></ul>'+
  '<p>'+(hi.m3?'Jouw record: <b>'+hi.m3+'</b> punten.':'Nog geen record. Jij zet de eerste.')+'</p>'+
  '<div class="actions"><button class="btn primary" data-act="go3">'+ICO.bolt+'<span>Start de klok</span></button><button class="btn outline" data-act="home">Terug</button></div></section></div>';

function startSpeed(){
  G=newG(3,{running:true,lock:false,last:null,dur:60000,cur:null,vs:poolVerbs()});
  app.innerHTML='<div class="game" style="--c:var(--m3)">'+
    hudHtml('<span class="pill" id="pTime">'+ICO.clock+'<b id="tv">60</b> s</span>',true)+
    '<section class="q" id="sq" style="--c:var(--m3)"></section></div>';
  G.end=performance.now()+G.dur;
  nextSpeed();updateHud();tick();
  timer=setInterval(tick,100);
}
function tick(){
  if(!G||G.mode!==3||!G.running)return;
  const left=Math.max(0,G.end-performance.now());
  const tv=$('#tv');if(tv)tv.textContent=Math.ceil(left/1000);
  const b=$('#bar');if(b)b.style.width=(left/G.dur*100)+'%';
  const pt=$('#pTime');if(pt)pt.classList.toggle('low',left<=10000);
  if(left<=0)finishSpeed();
}
function nextSpeed(){
  let v;
  do{v=pick(G.vs);}while(G.last===v&&G.vs.length>1);
  G.last=v;
  const kind=Math.random()<.5?'ps':'pp',m=makeOptions(v,kind);
  G.cur={v:v,kind:kind,ci:m.ci};G.lock=false;
  $('#sq').innerHTML='<p class="kicker">'+(kind==='ps'?'Past simple van':'Voltooid deelwoord van')+'</p>'+
  '<div class="given" style="margin-bottom:18px"><div><b class="mono" style="margin:0">'+esc(v.inf)+'</b></div><div><b class="nl" style="margin:0;font-size:clamp(22px,5vw,30px)">'+esc(v.nl)+'</b></div></div>'+
  '<div class="opts">'+m.opts.map(function(o,i){return '<button class="opt" data-act="opt" data-i="'+i+'"><span class="key">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>';}).join('')+'</div>';
}
function answerSpeed(i){
  if(!G||G.mode!==3||!G.running||G.lock)return;
  const btns=$$('.opt');if(!btns[i])return;
  G.lock=true;G.total++;
  const ok=i===G.cur.ci;
  if(ok){btns[i].classList.add('ok');award(G.cur.v);}
  else{btns[i].classList.add('bad');btns[G.cur.ci].classList.add('ok');miss(G.cur.v);}
  setTimeout(function(){if(G&&G.mode===3&&G.running)nextSpeed();},ok?220:900);
}
function finishSpeed(){
  if(!G||!G.running)return;
  G.running=false;stopTimer();showResult();
}

/* ---------- Resultaat ---------- */
function finish(){stopTimer();showResult();}
function showResult(){
  const key='m'+G.mode,prev=hi[key]||0,rec=G.score>prev&&G.score>0;
  if(rec){hi[key]=G.score;saveHi();}
  const acc=G.total?Math.round(G.correct/G.total*100):0;
  const missed=Array.from(G.missed.values());
  G.lastMissed=missed;
  const title=acc>=90?'Bijna foutloos.':acc>=70?'Goed bezig.':acc>=50?'Op de goede weg.':'Nog even blijven oefenen.';
  const c='var(--m'+G.mode+')';
  const rows=missed.map(function(v){return '<tr><td class="m spk-word" data-act="spk" data-txt="'+esc(v.inf+', '+v.ps+', '+v.pp)+'" title="Klik om te luisteren">'+esc(v.inf)+'</td><td class="m">'+esc(v.ps)+'</td><td class="m">'+esc(v.pp)+'</td><td class="nl">'+esc(v.nl)+'</td></tr>';}).join('');
  app.innerHTML='<div class="game" style="--c:'+c+'">'+top('')+
  '<section class="q" style="--c:'+c+'"><p class="kicker">'+NAMES[G.mode]+(G.mode===3?' · tijd om':' · klaar')+'</p>'+
  (rec?'<span class="badge">'+ICO.trophy+'Nieuw record</span>':'')+
  '<p class="score">'+G.score+'<span style="font-size:.28em;letter-spacing:0;margin-left:10px;color:var(--muted)">punten</span></p>'+
  '<p class="lead" style="margin-top:6px">'+title+(rec?'':(prev?' Je record is '+prev+'.':''))+'</p>'+
  '<div class="stats"><div class="stat"><span class="lab">Goed</span><b>'+G.correct+' / '+G.total+'</b></div>'+
  '<div class="stat"><span class="lab">Nauwkeurigheid</span><b>'+acc+'%</b></div>'+
  '<div class="stat"><span class="lab">Beste streak</span><b>'+G.best+'</b></div></div>'+
  '<div class="actions"><button class="btn primary" data-act="again">Opnieuw</button>'+
  (missed.length?'<button class="btn outline" data-act="fix">Oefen je fouten ('+missed.length+')</button>':'')+
  '<button class="btn ghost" data-act="home">Naar start</button></div>'+
  (missed.length?'<div class="missed"><h3>Hier ging het mis</h3><div class="tblwrap"><table><thead><tr><th>Infinitive</th><th>Past simple</th><th>Voltooid dw.</th><th>Vertaling</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'')+
  '</section></div>';
}

/* ---------- Events ---------- */
app.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t||!app.contains(t))return;
  const a=t.dataset.act;
  if(a==='home'||a==='stop')return home();
  if(a==='cheat')return cheatView();
  if(a==='pool'){const p=t.dataset.pool;pool=(p==='all'||p==='weak'||p==='top')?p:Number(p);return home();}
  if(a==='clearweak'){weak={};saveWeak();pool='all';return home();}
  if(a==='start1')return startDrill(poolVerbs());
  if(a==='start2')return startCtx(poolVerbs());
  if(a==='start3')return speedIntro();
  if(a==='go3')return startSpeed();
  if(a==='again'){
    if(G.mode===1)return startDrill(poolVerbs());
    if(G.mode===2)return startCtx(poolVerbs());
    return startSpeed();
  }
  if(a==='fix'){const m=G.lastMissed||[];return G.mode===2?startCtx(m):startDrill(m);}
  if(a==='tense'&&G&&G.mode===2&&!G.checked){
    G.chosen=t.dataset.t;
    $$('.segb').forEach(function(b){b.setAttribute('aria-checked',String(b===t));b.classList.toggle('sel',b===t);});
    const g=$('#gap');if(g)g.focus({preventScroll:true});
    return;
  }
  if(a==='opt')return answerSpeed(Number(t.dataset.i));
  if(a==='cl'){const l=t.dataset.l;cheat.l=(l==='all'||l==='weak'||l==='top')?l:Number(l);return cheatView();}
  if(a==='hide'){const k=t.dataset.col;cheat.hide[k]=!cheat.hide[k];t.setAttribute('aria-pressed',String(cheat.hide[k]));return fillCheat();}
  if(a==='rev'){t.classList.toggle('rev');return;}
  if(a==='spk'){speak(t.dataset.txt);return;}
});
app.addEventListener('change',function(e){
  if(e.target&&e.target.id==='hard'){
    hard=e.target.checked;
    const eg1=$('#eg1');
    if(eg1)eg1.innerHTML=getDrillEgHtml(hard);
  }
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  if(!G)return;
  if(G.mode===1)drillSubmit();else if(G.mode===2)ctxSubmit();
});
document.addEventListener('keydown',function(e){
  if(G&&G.mode===3&&G.running&&!G.lock&&/^[1-4]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey)answerSpeed(Number(e.key)-1);
});

home();
})();
</script>

</body>
</html>
